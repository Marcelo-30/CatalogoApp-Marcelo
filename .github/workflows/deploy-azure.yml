name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - release/final-cloud-deployment
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/marcelo-30/catalogoropa-marcelo-final-2026

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore CatalogoRopaMVC.slnx

      - name: Build solution
        run: dotnet build CatalogoRopaMVC.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CatalogoRopaMVC.slnx --configuration Release --no-build

  build_image:
    name: Build and publish container image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy and smoke test
    needs: build_image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          missing=()
          [[ -z "$AZURE_RESOURCE_GROUP" ]] && missing+=("production variable AZURE_RESOURCE_GROUP")
          [[ -z "$AZURE_CONTAINER_APP_NAME" ]] && missing+=("production variable AZURE_CONTAINER_APP_NAME")
          [[ -z "$AZURE_CLIENT_ID" ]] && missing+=("production secret AZURE_CLIENT_ID")
          [[ -z "$AZURE_TENANT_ID" ]] && missing+=("production secret AZURE_TENANT_ID")
          [[ -z "$AZURE_SUBSCRIPTION_ID" ]] && missing+=("production secret AZURE_SUBSCRIPTION_ID")

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy immutable image to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          registryUrl: ghcr.io

      - name: Smoke test public endpoints
        shell: bash
        run: |
          app_fqdn="$(
            az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --query properties.configuration.ingress.fqdn \
              --output tsv
          )"
          app_url="https://${app_fqdn}"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 8 \
            --retry-delay 15 \
            --retry-all-errors \
            "${app_url}/health"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 4 \
            --retry-delay 10 \
            --retry-all-errors \
            "${app_url}/"
