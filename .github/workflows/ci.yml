name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore CatalogoRopaMVC.slnx

      - name: Build solution
        run: dotnet build CatalogoRopaMVC.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CatalogoRopaMVC.slnx --configuration Release --no-build
